name: TrendGovernor Windows Build 06

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'TrendGovernorLiveCoreV2/**'
      - '.github/workflows/trendgovernor-windows-build.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        shell: pwsh
        run: dotnet restore 'TrendGovernorLiveCoreV2/src/TrendGovernor.Wpf/TrendGovernor.Wpf.csproj' -r win-x64

      - name: Build
        shell: pwsh
        run: dotnet build 'TrendGovernorLiveCoreV2/src/TrendGovernor.Wpf/TrendGovernor.Wpf.csproj' -c Release -r win-x64 --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: dotnet publish 'TrendGovernorLiveCoreV2/src/TrendGovernor.Wpf/TrendGovernor.Wpf.csproj' -c Release -r win-x64 --self-contained true --no-restore -o 'TrendGovernorLiveCoreV2/release' /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = 'TrendGovernorLiveCoreV2/release/TrendGovernor.Wpf.exe'
          if (-not (Test-Path $exe)) { throw 'TrendGovernor.Wpf.exe was not produced.' }
          $file = Get-Item $exe
          if ($file.Length -lt 1000000) { throw "Executable is unexpectedly small: $($file.Length) bytes" }
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Startup smoke test with crash-log gate
        shell: pwsh
        run: |
          $release = Resolve-Path 'TrendGovernorLiveCoreV2/release'
          $exe = Join-Path $release 'TrendGovernor.Wpf.exe'
          $logs = Join-Path $release 'logs'
          $crashLog = Join-Path $logs 'startup-crash.log'
          New-Item -ItemType Directory -Path $logs -Force | Out-Null
          if (Test-Path $crashLog) { Remove-Item $crashLog -Force }

          $process = Start-Process -FilePath $exe -WorkingDirectory $release -PassThru
          Start-Sleep -Seconds 15
          $process.Refresh()

          if (Test-Path $crashLog) {
            $content = Get-Content $crashLog -Raw
            Write-Host $content
            if ($content -match 'STARTUP_FATAL|UI_FATAL|UNHANDLED') {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
              throw 'WPF startup smoke test failed: fatal startup log detected.'
            }
          }

          if ($process.HasExited) {
            throw "WPF startup smoke test failed: process exited early with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force
          Write-Host 'WPF startup smoke test PASS: no fatal log and process remained alive for 15 seconds.'

      - name: Package release
        shell: pwsh
        run: |
          Copy-Item 'TrendGovernorLiveCoreV2/START_TOOL.cmd' 'TrendGovernorLiveCoreV2/release/START_TOOL.cmd' -Force
          New-Item -ItemType Directory -Path 'TrendGovernorLiveCoreV2/release/logs' -Force | Out-Null
          Compress-Archive -Path 'TrendGovernorLiveCoreV2/release/*' -DestinationPath 'TRENDGOVERNOR_WINDOWS_X64_BUILD_06_UI_PARENT_FIXED.zip' -Force

      - name: Upload Windows release
        uses: actions/upload-artifact@v4
        with:
          name: TRENDGOVERNOR_WINDOWS_X64_BUILD_06_UI_PARENT_FIXED
          path: TRENDGOVERNOR_WINDOWS_X64_BUILD_06_UI_PARENT_FIXED.zip
          if-no-files-found: error
          retention-days: 30
